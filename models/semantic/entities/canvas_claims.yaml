name: canvas_claims
display_name: "Claims"
entity_type: table
physical_table: dw.claims_fact
attributes:
  - name: claim_id
    type: string
    attribute_type: key
    is_primary_key: true
  - name: member_id
    type: string
    attribute_type: key
    pii_classification: pii
    masking_method: hash
  - name: paid_amount
    type: decimal
    attribute_type: measure
    validation_type: not_null
  - name: status
    type: string
    attribute_type: dimension
business_rules:
  - type: filter
    condition: "status != 'voided'"
